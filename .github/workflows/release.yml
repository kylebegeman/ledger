name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run ci

      - name: Check npm version
        id: npm_version
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi

          set +e
          view_output="$(npm view "$name@$version" version --json 2>&1)"
          view_status=$?
          set -e

          if [[ $view_status -eq 0 ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published; skipping npm publish."
          elif grep -q "E404" <<<"$view_output"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "$view_output" >&2
            echo "Could not determine whether $name@$version is already published." >&2
            exit "$view_status"
          fi

      - name: Publish
        if: ${{ steps.npm_version.outputs.published != 'true' }}
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "Using the NPM_TOKEN secret for authentication."
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          else
            echo "No NPM_TOKEN secret; publishing through npm trusted publishing (OIDC)."
          fi
          npm publish --provenance --access public

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          record=".ledger/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$record" ]]; then
            echo "No release record at $record; skipping the GitHub release." >&2
            exit 0
          fi

          notes="$(node -e '
            const fs = require("node:fs");
            const text = fs.readFileSync(process.argv[1], "utf8");
            const marker = "\n## Public Notes\n";
            const start = text.indexOf(marker);
            if (start < 0) process.exit(0);
            let body = text.slice(start + marker.length);
            const next = body.indexOf("\n## ");
            if (next >= 0) body = body.slice(0, next);
            process.stdout.write(body.trim());
          ' "$record")"
          if [[ -z "$notes" ]]; then
            notes="See ${record} for release details."
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Ledger ${GITHUB_REF_NAME}" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --title "Ledger ${GITHUB_REF_NAME}" --notes "$notes" --verify-tag
          fi
