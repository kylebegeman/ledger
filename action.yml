name: Ledger CI
description: Run Ledger's validation, docs audit, coverage, and docs impact checks on a pull request with annotations and a job summary.
author: Kyle Begeman

inputs:
  base:
    description: Base revision of the change range. Defaults to the pull request base SHA.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: Head revision of the change range. Defaults to the pull request head SHA.
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  command:
    description: Command that runs Ledger. Defaults to the published package through npx; use "node dist/cli.js" inside the Ledger repository.
    required: false
    default: npx --yes @kylebegeman/ledger@latest
  node-version:
    description: Node.js version to set up. Leave empty to skip setup-node.
    required: false
    default: "24"
  comment:
    description: Post the job summary as a pull request comment. Requires pull-requests write permission and GITHUB_TOKEN.
    required: false
    default: "false"

outputs:
  ok:
    description: Whether every Ledger check passed, as the string true or false.
    value: ${{ steps.ledger.outputs.ok }}

runs:
  using: composite
  steps:
    - name: Setup Node
      if: inputs.node-version != ''
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Ledger CI
      id: ledger
      shell: bash
      env:
        LEDGER_COMMAND: ${{ inputs.command }}
        LEDGER_BASE: ${{ inputs.base }}
        LEDGER_HEAD: ${{ inputs.head }}
      run: |
        set +e
        range=()
        if [[ -n "$LEDGER_BASE" && -n "$LEDGER_HEAD" ]]; then
          range=(--base "$LEDGER_BASE" --head "$LEDGER_HEAD")
        fi
        $LEDGER_COMMAND ci --github "${range[@]}"
        code=$?
        set -e
        if [[ $code -eq 0 ]]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi
        # GITHUB_STEP_SUMMARY is a different file in every step, so keep a copy for the comment step.
        if [[ -s "$GITHUB_STEP_SUMMARY" ]]; then
          cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/ledger-ci-summary.md"
        fi
        exit $code

    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        summary="$RUNNER_TEMP/ledger-ci-summary.md"
        if [[ ! -s "$summary" ]]; then
          echo "No Ledger summary to post."
          exit 0
        fi
        body="$(cat "$summary")"
        gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
